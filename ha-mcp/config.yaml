name: ha-mcp
version: "1.0.0"
slug: ha-mcp
description: База деталей, доноров и расходников — MCP, веб-интерфейс и сенсоры HA
url: https://github.com/pecherskiy-v/ha-mcp
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: веб-интерфейс и API для клиентов в локальной сети
watchdog: "http://[HOST]:[PORT:8765]/api/summary"
options:
  ollama_base: http://192.168.1.74:11434
  embed_model: nomic-embed-text
  chat_model: qwen3-vl:8b
  git_ref: main
schema:
  ollama_base: str
  embed_model: str
  chat_model: str
  git_ref: str
