name: Cognee
version: "1.0.17"
slug: cognee
description: Память агентов на графе знаний (Cognee MCP), общая для всех машин
url: https://github.com/topoteretes/cognee
arch:
  - amd64
  - aarch64
init: false
hassio_api: true
hassio_role: manager
startup: services
boot: auto
ports:
  8000/tcp: 8001
ports_description:
  8000/tcp: MCP по HTTP для клиентов в локальной сети
watchdog: "http://[HOST]:[PORT:8000]/health"
options:
  db_host: 4061d8e8-postgres-pgvector
  db_port: 5432
  db_name: ha_db
  db_user: ha_user
  db_password: ""
  db_password_from_addon: 4061d8e8_postgres_pgvector
  llm_provider: ollama
  llm_endpoint: http://192.168.1.74:11434
  llm_model: llama3.2:3b
  llm_api_key: ollama
  structured_output: instructor
  embedding_provider: ollama
  embedding_endpoint: http://192.168.1.74:11434/api/embed
  embedding_model: bge-m3:latest
  embedding_dimensions: 1024
  dataset_isolation: false
  reset_vector_store: false
  allowed_hosts: "*"
  log_level: ERROR
schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password?
  db_password_from_addon: str?
  llm_provider: list(ollama|openai|anthropic|gemini)
  llm_endpoint: str
  llm_model: str
  llm_api_key: password
  structured_output: list(instructor|litellm_native)
  embedding_provider: list(ollama|openai|fastembed)
  embedding_endpoint: str
  embedding_model: str
  embedding_dimensions: int
  dataset_isolation: bool
  reset_vector_store: bool
  allowed_hosts: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
