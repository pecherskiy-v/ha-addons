name: Agentmemory
# Версия дополнения своя, не равна версии npm-пакета: та задаётся аргументом
# AGENTMEMORY_VERSION в Dockerfile. Суффиксы вида 0.9.27-1 использовать нельзя —
# Home Assistant считает их пре-релизом, то есть СТАРШЕ базовой версии не будет.
version: "1.0.1"
slug: agentmemory
description: Общая память агентов (iii-движок + agentmemory), одна на все машины
url: https://github.com/pecherskiy-v/ha-addons/tree/main/agentmemory
arch:
  - amd64
  - aarch64
startup: services
# init оставлен по умолчанию (true): базовый образ теперь node:bookworm-slim,
# s6-overlay в нём нет, а init от Docker полезен — собирает зомби-процессы.
boot: auto
ports:
  3111/tcp: 3111
  3112/tcp: 3112
ports_description:
  3111/tcp: HTTP API — сюда смотрит AGENTMEMORY_URL на клиентах
  3112/tcp: поток событий (stream)
# HOME=/data: CLI кладёт туда скачанный бинарь iii и свой .env, а состояние
# пишется по абсолютным путям из iii-config.docker.yaml (/data/state_store.db).
environment:
  HOME: /data
# Health-эндпоинта у сервиса нет (любой путь отдаёт 404), поэтому проверяем
# живость самим портом, а не HTTP-ответом.
watchdog: "tcp://[HOST]:[PORT:3111]"
