name: Agentmemory
version: "0.9.27-1"
slug: agentmemory
description: Общая память агентов (iii-движок + agentmemory), одна на все машины
url: https://github.com/pecherskiy-v/ha-addons/tree/main/agentmemory
arch:
  - amd64
  - aarch64
startup: services
# init: false обязателен для базовых образов Home Assistant: в них s6-overlay v3,
# а он работает только как PID 1. При init: true Docker подставляет свой init
# первым процессом, и s6 падает с "s6-overlay-suexec: fatal: can only run as pid 1".
init: false
boot: auto
ports:
  3111/tcp: 3111
  3112/tcp: 3112
ports_description:
  3111/tcp: HTTP API — сюда смотрит AGENTMEMORY_URL на клиентах
  3112/tcp: поток событий (stream)
# HOME=/data: CLI кладёт туда скачанный бинарь iii и свой .env, а состояние
# пишется по абсолютным путям из iii-config.docker.yaml (/data/state_store.db).
environment:
  HOME: /data
# Health-эндпоинта у сервиса нет (любой путь отдаёт 404), поэтому проверяем
# живость самим портом, а не HTTP-ответом.
watchdog: "tcp://[HOST]:[PORT:3111]"
