name: Qdrant
version: "v1.19.1"
slug: qdrant
description: Векторная база для семантического поиска агентов (общая на все машины)
url: https://github.com/pecherskiy-v/ha-addons/tree/main/qdrant
arch:
  - amd64
  - aarch64
image: qdrant/qdrant
startup: services
boot: auto
ports:
  6333/tcp: 6333
  6334/tcp: 6334
ports_description:
  6333/tcp: HTTP API и веб-интерфейс (dashboard)
  6334/tcp: gRPC API
# Хранилище — в /data: этот каталог супервизор монтирует всегда, он переживает
# обновления add-on'а и попадает в бэкапы Home Assistant.
environment:
  QDRANT__STORAGE__STORAGE_PATH: /data/storage
  QDRANT__STORAGE__SNAPSHOTS_PATH: /data/snapshots
  QDRANT__SERVICE__HTTP_PORT: "6333"
  QDRANT__SERVICE__GRPC_PORT: "6334"
watchdog: "http://[HOST]:[PORT:6333]/healthz"
